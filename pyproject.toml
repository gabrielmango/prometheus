[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus"
version = "0.1.0"
description = "Template limpo para construção de ETLs com conexões a MongoDB e PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Equipe de Dados", email = "dados@example.com" }]
dependencies = [
    "python-dotenv>=1.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.40",
    "psycopg2-binary>=2.9.10",
    "pymongo>=4.12.0",
    "pandas>=2.2.3",
    "tenacity>=9.1.2",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "mypy>=1.13.0",
]

[project.scripts]
prometheus = "prometheus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
